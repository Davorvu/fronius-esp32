name: Build ESPHome
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and Compile ESPHome
        run: |
          pip install esphome
          esphome compile fronius-limit.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: fronius-firmware
          path: .esphome/build/fronius-limit/.pioenvs/fronius-limit/firmware.factory.bin
