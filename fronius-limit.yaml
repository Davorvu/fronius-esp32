esphome:
  name: fronius-limit
  friendly_name: Fronius Primo Limit

esp32:
  board: esp32dev
  framework:
    type: arduino

web_server:
  port: 80

wifi:
  id: my_wifi
  ap:
    ssid: "Fronius-Limit-Setup"
    password: "12345678"

captive_portal:

text:
  - platform: template
    name: "IP adresa invertera"
    id: inverter_ip
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "192.168.1.50"

switch:
  - platform: template
    name: "Zero Export (0 W)"
    id: zero_export_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: template
    name: "Potrošnja kuće (W)"
    id: house_load_w
    unit_of_measurement: "W"
    accuracy_decimals: 0

  - platform: template
    name: "Zadani limit invertera (%)"
    id: applied_limit_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1

interval:
  - interval: 3s
    then:
      - lambda: |-
          if (!id(my_wifi).is_connected()) return;
          int sock = ::lwip_socket(AF_INET, SOCK_STREAM, IPPROTO_IP);
          if (sock < 0) return;

          struct timeval tv;
          tv.tv_sec = 0;
          tv.tv_usec = 500000;
          ::lwip_setsockopt(sock, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
          ::lwip_setsockopt(sock, SOL_SOCKET, SO_SNDTIMEO, &tv, sizeof(tv));

          struct sockaddr_in dest;
          dest.sin_family = AF_INET;
          dest.sin_port = htons(502);
          if (::inet_pton(AF_INET, id(inverter_ip).state.c_str(), &dest.sin_addr) <= 0) {
            ::lwip_close(sock);
            return;
          }

          if (::lwip_connect(sock, (struct sockaddr *)&dest, sizeof(dest)) != 0) {
            ::lwip_close(sock);
            return;
          }

          // 1. Čitanje snage sa Smart Metera (Unit ID 240, SunSpec float 40097)
          uint8_t m0=0x00, m1=0x01, m2=0x00, m3=0x00, m4=0x00, m5=0x06, m6=0xF0, m7=0x03, m8=0x9C, m9=0x97, m10=0x00, m11=0x02;
          ::lwip_send(sock, &m0, 1, 0); ::lwip_send(sock, &m1, 1, 0); ::lwip_send(sock, &m2, 1, 0); ::lwip_send(sock, &m3, 1, 0);
          ::lwip_send(sock, &m4, 1, 0); ::lwip_send(sock, &m5, 1, 0); ::lwip_send(sock, &m6, 1, 0); ::lwip_send(sock, &m7, 1, 0);
          ::lwip_send(sock, &m8, 1, 0); ::lwip_send(sock, &m9, 1, 0); ::lwip_send(sock, &m10, 1, 0); ::lwip_send(sock, &m11, 1, 0);

          float grid_w = 0;
          uint8_t b = 0;
          int count = 0;
          uint32_t b1 = 0, b2 = 0, b3 = 0, b4 = 0;
          while (count < 13 && ::lwip_recv(sock, &b, 1, 0) == 1) {
            if (count == 9) b1 = b;
            if (count == 10) b2 = b;
            if (count == 11) b3 = b;
            if (count == 12) b4 = b;
            count++;
          }
          if (count == 13) {
            uint32_t raw = (b1 << 24) | (b2 << 16) | (b3 << 8) | b4;
            memcpy(&grid_w, &raw, sizeof(float));
          }

          // 2. Čitanje trenutne proizvodnje invertera (Unit ID 1, SunSpec float 40083)
          uint8_t i0=0x00, i1=0x02, i2=0x00, i3=0x00, i4=0x00, i5=0x06, i6=0x01, i7=0x03, i8=0x9C, i9=0x93, i10=0x00, i11=0x02;
          ::lwip_send(sock, &i0, 1, 0); ::lwip_send(sock, &i1, 1, 0); ::lwip_send(sock, &i2, 1, 0); ::lwip_send(sock, &i3, 1, 0);
          ::lwip_send(sock, &i4, 1, 0); ::lwip_send(sock, &i5, 1, 0); ::lwip_send(sock, &i6, 1, 0); ::lwip_send(sock, &i7, 1, 0);
          ::lwip_send(sock, &i8, 1, 0); ::lwip_send(sock, &i9, 1, 0); ::lwip_send(sock, &i10, 1, 0); ::lwip_send(sock, &i11, 1, 0);

          float pv_w = 0;
          count = 0;
          b1 = 0; b2 = 0; b3 = 0; b4 = 0;
          while (count < 13 && ::lwip_recv(sock, &b, 1, 0) == 1) {
            if (count == 9) b1 = b;
            if (count == 10) b2 = b;
            if (count == 11) b3 = b;
            if (count == 12) b4 = b;
            count++;
          }
          if (count == 13) {
            uint32_t raw = (b1 << 24) | (b2 << 16) | (b3 << 8) | b4;
            memcpy(&pv_w, &raw, sizeof(float));
          }

          // Izračun potrošnje kuće i limita za 4000 W inverter
          float house_w = pv_w + grid_w;
          if (house_w < 0) house_w = 0;
          id(house_load_w).publish_state(house_w);

          float limit_pct = 100.0;
          if (id(zero_export_switch).state) {
            limit_pct = (house_w / 4000.0) * 100.0;
            if (limit_pct > 100.0) limit_pct = 100.0;
            if (limit_pct < 0.0) limit_pct = 0.0;
          }
          id(applied_limit_pct).publish_state(limit_pct);

          // 3. Upis limita u inverter (registar 40232 = WMaxLimPct, 40236 = WMaxLim_Ena)
          uint16_t pct_scaled = (uint16_t)(limit_pct * 100.0);
          uint8_t hi = (uint8_t)(pct_scaled >> 8);
          uint8_t lo = (uint8_t)(pct_scaled & 0xFF);
          uint8_t w0=0x00, w1=0x03, w2=0x00, w3=0x00, w4=0x00, w5=0x11, w6=0x01, w7=0x10;
          uint8_t w8=0x9D, w9=0x28, w10=0x00, w11=0x05, w12=0x0A;
          uint8_t z=0x00, one=0x01;
          ::lwip_send(sock, &w0, 1, 0); ::lwip_send(sock, &w1, 1, 0); ::lwip_send(sock, &w2, 1, 0); ::lwip_send(sock, &w3, 1, 0);
          ::lwip_send(sock, &w4, 1, 0); ::lwip_send(sock, &w5, 1, 0); ::lwip_send(sock, &w6, 1, 0); ::lwip_send(sock, &w7, 1, 0);
          ::lwip_send(sock, &w8, 1, 0); ::lwip_send(sock, &w9, 1, 0); ::lwip_send(sock, &w10, 1, 0); ::lwip_send(sock, &w11, 1, 0);
          ::lwip_send(sock, &w12, 1, 0); ::lwip_send(sock, &hi, 1, 0); ::lwip_send(sock, &lo, 1, 0);
          ::lwip_send(sock, &z, 1, 0); ::lwip_send(sock, &z, 1, 0); ::lwip_send(sock, &z, 1, 0); ::lwip_send(sock, &z, 1, 0);
          ::lwip_send(sock, &z, 1, 0); ::lwip_send(sock, &z, 1, 0); ::lwip_send(sock, &z, 1, 0); ::lwip_send(sock, &one, 1, 0);

          count = 0;
          while (count < 12 && ::lwip_recv(sock, &b, 1, 0) == 1) count++;
          ::lwip_close(sock);
