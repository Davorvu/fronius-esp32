esp32:
  board: esp32dev
  framework:
    type: arduino

# Učitavanje podrške za mrežni Modbus TCP (komunikacija preko routera bez žica)
external_components:
  - source: github://pebblebed-tech/esphome-modbus-tcp
    components: [modbus_tcp]

web_server:
  port: 80
  version: 3

wifi:
  ap:
    ssid: "Fronius-Limit-Setup"
    password: "12345678"

captive_portal:

# Lokalni upis IP adrese invertera na ekranu mobitela (ostaje samo u vašoj kući)
text:
  - platform: template
    name: "IP adresa invertera"
    id: inverter_ip
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "192.168.1.50"

# Glavni prekidač na mobitelu: Zero Export 0 W (ON / OFF)
switch:
  - platform: template
    name: "Zero Export (0 W)"
    id: zero_export_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# Očitanja na ekranu mobitela
sensor:
  - platform: template
    name: "Potrošnja kuće (W)"
    id: house_load_w
    unit_of_measurement: "W"
    accuracy_decimals: 0

  - platform: template
    name: "Proizvodnja panela (W)"
    id: pv_power_w
    unit_of_measurement: "W"
    accuracy_decimals: 0

  - platform: template
    name: "Zadani limit invertera (%)"
    id: applied_limit_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1
