esphome:
  name: fronius-limit
  friendly_name: Fronius Primo Limit
  includes:
    - <WiFi.h>

esp32:
  board: esp32dev
  framework:
    type: arduino

web_server:
  port: 80

wifi:
  ap:
    ssid: "Fronius-Limit-Setup"
    password: "12345678"

captive_portal:

# Lokalni upis IP adrese invertera (upisujete na mobitelu, ne ide na internet)
text:
  - platform: template
    name: "IP adresa invertera"
    id: inverter_ip
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "192.168.1.50"

# Glavni prekidač na mobitelu: Zero Export 0 W (ON = 0 W izvoza, OFF = 100 % izvoza)
switch:
  - platform: template
    name: "Zero Export (0 W)"
    id: zero_export_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# Očitanja na ekranu mobitela
sensor:
  - platform: template
    name: "Potrošnja kuće (W)"
    id: house_load_w
    unit_of_measurement: "W"
    accuracy_decimals: 0

  - platform: template
    name: "Zadani limit invertera (%)"
    id: applied_limit_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1

# Regulacija svake 3 sekunde preko Modbus TCP (port 502)
interval:
  - interval: 3s
    then:
      - lambda: |-
          if (!WiFi.isConnected()) return;
          WiFiClient client;
          if (!client.connect(id(inverter_ip).state.c_str(), 502)) return;

          // 1. Čitanje aktivne snage sa Smart Metera (Unit ID 240, SunSpec registar 40097 / 40087)
          uint8_t req_meter[12] = {0x00, 0x01, 0x00, 0x00, 0x00, 0x06, 0xF0, 0x03, 0x9C, 0x97, 0x00, 0x02};
          client.write(req_meter, 12);
          unsigned long t = millis();
          while (client.available() < 13 && millis() - t < 500) delay(5);
         
          float grid_w = 0;
          if (client.available() >= 13) {
            uint8_t resp[13];
            client.read(resp, 13);
            uint32_t raw = ((uint32_t)resp[9] << 24) | ((uint32_t)resp[10] << 16) | ((uint32_t)resp[11] << 8) | resp[12];
            memcpy(&grid_w, &raw, sizeof(float));
          }

          // 2. Čitanje trenutne proizvodnje invertera (Unit ID 1, SunSpec float registar 40083)
          uint8_t req_inv[12] = {0x00, 0x02, 0x00, 0x00, 0x00, 0x06, 0x01, 0x03, 0x9C, 0x93, 0x00, 0x02};
          client.write(req_inv, 12);
          t = millis();
          while (client.available() < 13 && millis() - t < 500) delay(5);

          float pv_w = 0;
          if (client.available() >= 13) {
            uint8_t resp[13];
            client.read(resp, 13);
            uint32_t raw = ((uint32_t)resp[9] << 24) | ((uint32_t)resp[10] << 16) | ((uint32_t)resp[11] << 8) | resp[12];
            memcpy(&pv_w, &raw, sizeof(float));
          }

          // Izračun potrošnje kuće i postotka limita za 4000 W inverter
          float house_w = pv_w + grid_w;
          if (house_w < 0) house_w = 0;
          id(house_load_w).publish_state(house_w);

          float limit_pct = 100.0;
          if (id(zero_export_switch).state) {
            limit_pct = (house_w / 4000.0) * 100.0;
            if (limit_pct > 100.0) limit_pct = 100.0;
            if (limit_pct < 0.0) limit_pct = 0.0;
          }
          id(applied_limit_pct).publish_state(limit_pct);

          // 3. Slanje WMaxLimPct (registar 40232, skala 100) i WMaxLim_Ena = 1 (registar 40236)
          uint16_t pct_scaled = (uint16_t)(limit_pct * 100.0);
          uint8_t write_req[23] = {
            0x00, 0x03, 0x00, 0x00, 0x00, 0x11, 0x01, 0x10,
            0x9D, 0x28, 0x00, 0x05, 0x0A,
            (uint8_t)(pct_scaled >> 8), (uint8_t)(pct_scaled & 0xFF),
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x01
          };
          client.write(write_req, 23);
          t = millis();
          while (client.available() < 12 && millis() - t < 500) delay(5);
          client.stop();
