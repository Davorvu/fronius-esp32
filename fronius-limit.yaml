esphome:
  name: fronius-limit
  friendly_name: Fronius Export Limiter
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(params_status).publish_state("Spremno");
          bool has_today = false;
          for (int i = 0; i < 24; i++) {
            if (id(cropex_today)[i] > -900.0) { has_today = true; break; }
          }
          if (has_today) {
            id(cropex_status).publish_state("OK: Učitano iz memorije");
          } else {
            id(cropex_status).publish_state("Čeka 23:00h / ručni dohvat");
          }
      - delay: 20s
      - script.execute: fetch_cropex_prices

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: ERROR

ota:
  platform: esphome

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: group_mode
      name: "0. Upravljanje i režim rada"
      sorting_weight: 5
    - id: group_live
      name: "1. Live mjerenja"
      sorting_weight: 10
    - id: group_balance
      name: "2. Mjesečna bilanca (HEP)"
      sorting_weight: 20
    - id: group_params
      name: "3. Parametri i postavke"
      sorting_weight: 30

wifi:
  id: my_wifi
  ap:
    ssid: "Fronius-Limit-Setup"
    password: "12345678"

captive_portal:
improv_serial:

http_request:
  verify_ssl: false
  timeout: 10s

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Zagreb
    on_time:
      - seconds: 0
        minutes: 0
        hours: 23
        then:
          - script.execute: fetch_cropex_prices
      - seconds: 0
        minutes: 30
        hours: 23
        then:
          - lambda: |-
              if (id(cropex_tomorrow)[12] <= -900.0) {
                id(fetch_cropex_prices).execute();
              }
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              bool has_tmrw = false;
              for (int i = 0; i < 24; i++) {
                if (id(cropex_tomorrow)[i] > -900.0) { has_tmrw = true; break; }
              }
              if (has_tmrw) {
                for (int i = 0; i < 24; i++) {
                  id(cropex_today)[i] = id(cropex_tomorrow)[i];
                  id(cropex_tomorrow)[i] = -9999.0;
                }
                id(cropex_status).publish_state("Prebačeno na današnji dan");
              }
      - seconds: 0
        minutes: 5
        hours: 0
        then:
          - lambda: |-
              auto now = id(sntp_time).now();
              if (now.is_valid() && id(cropex_today)[now.hour] <= -900.0) {
                id(fetch_cropex_prices).execute();
              }

output:
  - platform: gpio
    pin: GPIO2
    id: blue_led

globals:
  - id: comm_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: led_blink_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: saved_month
    type: int
    restore_value: yes
    initial_value: '0'
  - id: base_import_kwh
    type: float
    restore_value: yes
    initial_value: '-1.0'
  - id: base_export_kwh
    type: float
    restore_value: yes
    initial_value: '-1.0'
  - id: last_total_import_kwh
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: last_total_export_kwh
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: active_max_w
    type: float
    restore_value: yes
    initial_value: '3680.0'
  - id: active_export_w
    type: float
    restore_value: yes
    initial_value: '3680.0'
  - id: active_margin_w
    type: float
    restore_value: yes
    initial_value: '50.0'
  - id: active_credit_kwh
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: active_min_price
    type: float
    restore_value: yes
    initial_value: '20.0'
  - id: cropex_today
    type: float[24]
    restore_value: yes
    initial_value: '{-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999}'
  - id: cropex_tomorrow
    type: float[24]
    restore_value: yes
    initial_value: '{-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999,-9999}'
  - id: graf_server_started
    type: bool
    restore_value: no
    initial_value: 'false'

text_sensor:
  - platform: template
    name: "Tokovi energije"
    id: energy_flow_visual
    update_interval: never
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 1
  - platform: template
    name: "Status sustava"
    id: modbus_status
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 2
  - platform: template
    name: "Grafički prikaz"
    id: graf_url_info
    entity_category: ""
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 6
  - platform: template
    name: "Status CROPEX tablice"
    id: cropex_status
    update_interval: never
    web_server:
      sorting_group_id: group_params
      sorting_weight: 8
  - platform: wifi_info
    ip_address:
      name: "IP adresa pločice"
      id: ip_addr_sensor
      web_server:
        sorting_group_id: group_params
        sorting_weight: 9
    mac_address:
      name: "MAC adresa pločice"
      web_server:
        sorting_group_id: group_params
        sorting_weight: 10
  - platform: template
    name: "Status postavki"
    id: params_status
    update_interval: never
    web_server:
      sorting_group_id: group_params
      sorting_weight: 11
  - platform: version
    name: "Verzija softvera (SW)"
    hide_timestamp: false
    web_server:
      sorting_group_id: group_params
      sorting_weight: 12

switch:
  - platform: template
    name: "A. Ručni limit izvoza"
    id: manual_limit_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 3
    on_turn_on:
      - switch.turn_off: auto_balance_switch
      - switch.turn_off: cropex_limit_switch
  - platform: template
    name: "B. Auto balansiranje mjesec (HEP)"
    id: auto_balance_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 4
    on_turn_on:
      - switch.turn_off: manual_limit_switch
      - switch.turn_off: cropex_limit_switch
  - platform: template
    name: "C. CROPEX dinamički limit (Cijena)"
    id: cropex_limit_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 5
    on_turn_on:
      - switch.turn_off: manual_limit_switch
      - switch.turn_off: auto_balance_switch

sensor:
  - platform: template
    name: "Proizvodnja panela (W)"
    id: pv_power_w
    unit_of_measurement: "W"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: group_live
      sorting_weight: 1
  - platform: template
    name: "Brojilo mreža (+uvoz / -izvoz) (W)"
    id: grid_power_w
    unit_of_measurement: "W"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: group_live
      sorting_weight: 2
  - platform: template
    name: "Potrošnja kuće (W)"
    id: house_load_w
    unit_of_measurement: "W"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: group_live
      sorting_weight: 3
  - platform: template
    name: "Zadani limit invertera (%)"
    id: applied_limit_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_live
      sorting_weight: 4
  - platform: template
    name: "Trenutna CROPEX cijena (€/MWh)"
    id: current_cropex_price
    unit_of_measurement: "€/MWh"
    accuracy_decimals: 2
    web_server:
      sorting_group_id: group_live
      sorting_weight: 5
  - platform: template
    name: "Mjesečno preuzeto (kWh)"
    id: month_import_kwh
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_balance
      sorting_weight: 1
  - platform: template
    name: "Mjesečno predano (kWh)"
    id: month_export_kwh
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_balance
      sorting_weight: 2
  - platform: template
    name: "Mjesečna bilanca (+preuzeto / -predano) (kWh)"
    id: month_balance_kwh
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_balance
      sorting_weight: 3

button:
  - platform: template
    name: "7. Spremi i primijeni postavke"
    web_server:
      sorting_group_id: group_params
      sorting_weight: 7
    on_press:
      - lambda: |-
          id(active_max_w) = id(inverter_max_w).state;
          id(active_export_w) = id(max_export_w).state;
          id(active_margin_w) = id(safety_margin_w).state;
          id(active_credit_kwh) = id(initial_credit_kwh).state;
          id(active_min_price) = id(min_export_price).state;
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            char buf[40];
            snprintf(buf, sizeof(buf), "Spremljeno (%02d:%02d:%02d)", now.hour, now.minute, now.second);
            id(params_status).publish_state(buf);
          } else {
            id(params_status).publish_state("Spremljeno i aktivno");
          }
  - platform: template
    name: "Osvježi CROPEX cijene sada"
    web_server:
      sorting_group_id: group_params
      sorting_weight: 13
    on_press:
      - script.execute: fetch_cropex_prices
  - platform: template
    name: "Resetiraj mjesečni brojač na 0"
    web_server:
      sorting_group_id: group_balance
      sorting_weight: 4
    on_press:
      - lambda: |-
          id(reset_requested) = true;

text:
  - platform: template
    name: "1. IP adresa invertera"
    id: inverter_ip
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "0.0.0.0"
    web_server:
      sorting_group_id: group_params
      sorting_weight: 1

number:
  - platform: template
    name: "2. Nazivna snaga invertera (W)"
    id: inverter_max_w
    min_value: 1000
    max_value: 50000
    step: 10
    unit_of_measurement: "W"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3680
    web_server:
      sorting_group_id: group_params
      sorting_weight: 2
  - platform: template
    name: "3. Dozvoljeni izvoz u mrežu (W)"
    id: max_export_w
    min_value: 0
    max_value: 50000
    step: 10
    unit_of_measurement: "W"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3680
    web_server:
      sorting_group_id: group_params
      sorting_weight: 3
  - platform: template
    name: "4. Sigurnosna rezerva (W)"
    id: safety_margin_w
    min_value: 0
    max_value: 1000
    step: 10
    unit_of_measurement: "W"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 50
    web_server:
      sorting_group_id: group_params
      sorting_weight: 4
  - platform: template
    name: "5. Početni saldo mjeseca (kWh)"
    id: initial_credit_kwh
    min_value: -5000
    max_value: 5000
    step: 1
    unit_of_measurement: "kWh"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    web_server:
      sorting_group_id: group_params
      sorting_weight: 5
  - platform: template
    name: "6. Minimalna cijena za izvoz (€/MWh)"
    id: min_export_price
    min_value: -200
    max_value: 500
    step: 1
    unit_of_measurement: "€/MWh"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 20
    web_server:
      sorting_group_id: group_params
      sorting_weight: 6

script:
  - id: fetch_cropex_prices
    mode: single
    then:
      - lambda: |-
          id(cropex_status).publish_state("Preuzimam CROPEX (HR)...");
      - http_request.get:
          url: "https://api.energy-charts.info/price?bzn=HR"
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    size_t p_idx = body.find("\"price\"");
                    if (p_idx != std::string::npos) {
                      size_t bracket = body.find("[", p_idx);
                      size_t start = bracket + 1;
                      size_t end = body.find("]", start);
                      std::string arr = body.substr(start, end - start);
                      float vals[200];
                      int n = 0;
                      size_t pos = 0;
                      while (pos < arr.length() && n < 192) {
                        size_t comma = arr.find(',', pos);
                        std::string tok = (comma == std::string::npos) ? arr.substr(pos) : arr.substr(pos, comma - pos);
                        while (!tok.empty() && (tok[0] == ' ' || tok[0] == '\n' || tok[0] == '\r')) tok.erase(0, 1);
                        while (!tok.empty() && (tok.back() == ' ' || tok.back() == '\n' || tok.back() == '\r')) tok.pop_back();
                        if (tok != "null" && !tok.empty()) {
                          vals[n++] = atof(tok.c_str());
                        }
                        if (comma == std::string::npos) break;
                        pos = comma + 1;
                      }
                      if (n >= 24) {
                        int step = (n >= 96) ? 4 : 1;
                        int hours_avail = n / step;
                        int today_count = (hours_avail >= 24) ? 24 : hours_avail;
                        for (int h = 0; h < today_count; h++) {
                          float sum = 0;
                          for (int q = 0; q < step; q++) sum += vals[h * step + q];
                          id(cropex_today)[h] = sum / (float)step;
                        }
                        if (hours_avail >= 48) {
                          for (int h = 0; h < 24; h++) {
                            float sum = 0;
                            for (int q = 0; q < step; q++) sum += vals[(24 + h) * step + q];
                            id(cropex_tomorrow)[h] = sum / (float)step;
                          }
                          id(cropex_status).publish_state("OK: Učitano danas + sutra (48h)");
                        } else {
                          id(cropex_status).publish_state("OK: Učitano za danas (24h)");
                        }
                      } else {
                        id(cropex_status).publish_state("Greška: Nepotpun odgovor");
                      }
                    } else {
                      id(cropex_status).publish_state("Greška: Nema polja cijena");
                    }
                  } else {
                    char err[32];
                    snprintf(err, sizeof(err), "HTTP greška: %d", response->status_code);
                    id(cropex_status).publish_state(err);
                  }
          on_error:
            then:
              - lambda: |-
                  id(cropex_status).publish_state("Greška spajanja na CROPEX");

interval:
  - interval: 300ms
    then:
      - lambda: |-
          if (id(comm_ok)) {
            id(blue_led).turn_on();
          } else {
            id(led_blink_state) = !id(led_blink_state);
            if (id(led_blink_state)) id(blue_led).turn_on();
            else id(blue_led).turn_off();
          }
  - interval: 80ms
    then:
      - lambda: |-
          static int srv_sock = -1;
          if (id(my_wifi).is_connected()) {
            if (srv_sock < 0) {
              srv_sock = ::lwip_socket(AF_INET, SOCK_STREAM, IPPROTO_IP);
              if (srv_sock >= 0) {
                int opt = 1;
                ::lwip_setsockopt(srv_sock, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof(opt));
                int fl = ::lwip_fcntl(srv_sock, F_GETFL, 0);
                ::lwip_fcntl(srv_sock, F_SETFL, fl | O_NONBLOCK);
                struct sockaddr_in addr;
                addr.sin_family = AF_INET;
                addr.sin_port = htons(8080);
                addr.sin_addr.s_addr = INADDR_ANY;
                if (::lwip_bind(srv_sock, (struct sockaddr *)&addr, sizeof(addr)) == 0) {
                  ::lwip_listen(srv_sock, 2);
                } else {
                  ::lwip_close(srv_sock);
                  srv_sock = -1;
                }
              }
            }
            if (!id(graf_server_started) && id(ip_addr_sensor).has_state() && id(ip_addr_sensor).state.length() > 6) {
              char u[64];
              snprintf(u, sizeof(u), "http://%s:8080", id(ip_addr_sensor).state.c_str());
              id(graf_url_info).publish_state(u);
              id(graf_server_started) = true;
            }
            if (srv_sock >= 0) {
              struct sockaddr_in cl_addr;
              socklen_t cl_len = sizeof(cl_addr);
              int cl = ::lwip_accept(srv_sock, (struct sockaddr *)&cl_addr, &cl_len);
              if (cl >= 0) {
                struct timeval tv;
                tv.tv_sec = 0;
                tv.tv_usec = 300000;
                ::lwip_setsockopt(cl, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
                char req[256] = {0};
                int r = ::lwip_recv(cl, req, sizeof(req) - 1, 0);
                if (r > 0) {
                  if (strstr(req, "GET /data") != NULL) {
                    float pv = std::isnan(id(pv_power_w).state) ? 0.0f : id(pv_power_w).state;
                    float hs = std::isnan(id(house_load_w).state) ? 0.0f : id(house_load_w).state;
                    float gr = std::isnan(id(grid_power_w).state) ? 0.0f : id(grid_power_w).state;
                    float lm = std::isnan(id(applied_limit_pct).state) ? 100.0f : id(applied_limit_pct).state;
                    float bl = std::isnan(id(month_balance_kwh).state) ? 0.0f : id(month_balance_kwh).state;
                    float cp = std::isnan(id(current_cropex_price).state) ? -999.0f : id(current_cropex_price).state;
                    const char* st = id(modbus_status).has_state() ? id(modbus_status).state.c_str() : "Spremno";
                    char json[256];
                    int jlen = snprintf(json, sizeof(json),
                      "{\"pv\":%.1f,\"house\":%.1f,\"grid\":%.1f,\"lim\":%.1f,\"bal\":%.1f,\"crp\":%.2f,\"st\":\"%s\"}",
                      pv, hs, gr, lm, bl, cp, st);
                    char hdr[160];
                    int hlen = snprintf(hdr, sizeof(hdr),
                      "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n\r\n", jlen);
                    ::lwip_send(cl, hdr, hlen, 0);
                    ::lwip_send(cl, json, jlen, 0);
                  } else {
                    static const char page[] =
                      "<!DOCTYPE html><html lang='hr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Solarni nadzor</title>"
                      "<style>body{margin:0;background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}"
                      "h2{margin:6px 0 14px;font-size:20px;font-weight:600;color:#e2e8f0}.box{width:100%;max-width:440px;background:#1e293b;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}"
                      ".cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.card{background:#0f172a;border-radius:10px;padding:10px 6px;text-align:center}"
                      ".lbl{font-size:11px;color:#94a3b8;margin-bottom:4px}.val{font-size:15px;font-weight:700}"
                      ".btn{display:block;width:100%;box-sizing:border-box;margin-top:14px;padding:12px;background:#334155;color:#fff;text-align:center;text-decoration:none;border-radius:10px;font-weight:600;font-size:14px}"
                      ".mode{text-align:center;margin-top:10px;font-size:13px;color:#38bdf8;font-weight:600}"
                      "@keyframes flow{to{stroke-dashoffset:-24}}.anim{stroke-dasharray:6 6;animation:flow 1s linear infinite}</style></head><body>"
                      "<h2>Solarni sustav – tokovi energije</h2><div class='box'>"
                      "<svg viewBox='0 0 360 250' width='100%'>"
                      "<line id='l_pv_h' x1='180' y1='58' x2='75' y2='175' stroke='#334155' stroke-width='4' stroke-linecap='round'/>"
                      "<line id='l_pv_g' x1='180' y1='58' x2='285' y2='175' stroke='#334155' stroke-width='4' stroke-linecap='round'/>"
                      "<line id='l_g_h' x1='260' y1='195' x2='100' y2='195' stroke='#334155' stroke-width='4' stroke-linecap='round'/>"
                      "<circle id='c_pv' cx='180' cy='45' r='30' fill='#0f172a' stroke='#eab308' stroke-width='3'/>"
                      "<text x='180' y='41' text-anchor='middle' fill='#eab308' font-size='11' font-weight='bold'>PANELI</text>"
                      "<text id='t_pv' x='180' y='56' text-anchor='middle' fill='#fff' font-size='12' font-weight='bold'>0 W</text>"
                      "<circle cx='70' cy='195' r='30' fill='#0f172a' stroke='#3b82f6' stroke-width='3'/>"
                      "<text x='70' y='191' text-anchor='middle' fill='#60a5fa' font-size='11' font-weight='bold'>KUĆA</text>"
                      "<text id='t_h' x='70' y='206' text-anchor='middle' fill='#fff' font-size='12' font-weight='bold'>0 W</text>"
                      "<circle id='c_g' cx='290' cy='195' r='30' fill='#0f172a' stroke='#22c55e' stroke-width='3'/>"
                      "<text id='t_gl' x='290' y='191' text-anchor='middle' fill='#4ade80' font-size='10' font-weight='bold'>MREŽA</text>"
                      "<text id='t_g' x='290' y='206' text-anchor='middle' fill='#fff' font-size='12' font-weight='bold'>0 W</text>"
                      "</svg>"
                      "<div class='mode' id='m_txt'>Učitavanje...</div>"
                      "<div class='cards'>"
                      "<div class='card'><div class='lbl'>Limit inv.</div><div class='val' id='v_lim'>-- %</div></div>"
                      "<div class='card'><div class='lbl'>Bilanca mj.</div><div class='val' id='v_bal'>-- kWh</div></div>"
