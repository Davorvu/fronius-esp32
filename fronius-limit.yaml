esphome:
  name: fronius-limit
  friendly_name: Fronius Primo Limit
  includes:
    - <WiFi.h>

esp32:
  board: esp32dev
  framework:
    type: arduino

web_server:
  port: 80

wifi:
  ap:
    ssid: "Fronius-Limit-Setup"
    password: "12345678"

captive_portal:

text:
  - platform: template
    name: "IP adresa invertera"
    id: inverter_ip
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "192.168.1.50"

switch:
  - platform: template
    name: "Zero Export (0 W)"
    id: zero_export_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: template
    name: "Potrošnja kuće (W)"
    id: house_load_w
    unit_of_measurement: "W"
    accuracy_decimals: 0

  - platform: template
    name: "Zadani limit invertera (%)"
    id: applied_limit_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1

interval:
  - interval: 3s
    then:
      - lambda: |-
          if (!WiFi.isConnected()) return;
          WiFiClient client;
          if (!client.connect(id(inverter_ip).state.c_str(), 502)) return;

          // 1. Čitanje snage sa Smart Metera (Unit ID 240, SunSpec float 40097)
          client.write((uint8_t)0x00); client.write((uint8_t)0x01);
          client.write((uint8_t)0x00); client.write((uint8_t)0x00);
          client.write((uint8_t)0x00); client.write((uint8_t)0x06);
          client.write((uint8_t)0xF0); client.write((uint8_t)0x03);
          client.write((uint8_t)0x9C); client.write((uint8_t)0x97);
          client.write((uint8_t)0x00); client.write((uint8_t)0x02);

          unsigned long t = millis();
          while (client.available() < 13 && millis() - t < 500) delay(5);

          float grid_w = 0;
          if (client.available() >= 13) {
            for (int i = 0; i < 9; i++) client.read();
            uint32_t b1 = client.read();
            uint32_t b2 = client.read();
            uint32_t b3 = client.read();
            uint32_t b4 = client.read();
            uint32_t raw = (b1 << 24) | (b2 << 16) | (b3 << 8) | b4;
            memcpy(&grid_w, &raw, sizeof(float));
          }

          // 2. Čitanje trenutne proizvodnje invertera (Unit ID 1, SunSpec float 40083)
          client.write((uint8_t)0x00); client.write((uint8_t)0x02);
          client.write((uint8_t)0x00); client.write((uint8_t)0x00);
          client.write((uint8_t)0x00); client.write((uint8_t)0x06);
          client.write((uint8_t)0x01); client.write((uint8_t)0x03);
          client.write((uint8_t)0x9C); client.write((uint8_t)0x93);
          client.write((uint8_t)0x00); client.write((uint8_t)0x02);

          t = millis();
          while (client.available() < 13 && millis() - t < 500) delay(5);

          float pv_w = 0;
          if (client.available() >= 13) {
            for (int i = 0; i < 9; i++) client.read();
            uint32_t b1 = client.read();
            uint32_t b2 = client.read();
            uint32_t b3 = client.read();
            uint32_t b4 = client.read();
            uint32_t raw = (b1 << 24) | (b2 << 16) | (b3 << 8) | b4;
            memcpy(&pv_w, &raw, sizeof(float));
          }

          // Izračun potrošnje kuće i limita za 4000 W inverter
          float house_w = pv_w + grid_w;
          if (house_w < 0) house_w = 0;
          id(house_load_w).publish_state(house_w);

          float limit_pct = 100.0;
          if (id(zero_export_switch).state) {
            limit_pct = (house_w / 4000.0) * 100.0;
            if (limit_pct > 100.0) limit_pct = 100.0;
            if (limit_pct < 0.0) limit_pct = 0.0;
          }
          id(applied_limit_pct).publish_state(limit_pct);

          // 3. Upis limita u inverter (registar 40232 = WMaxLimPct, 40236 = WMaxLim_Ena)
          uint16_t pct_scaled = (uint16_t)(limit_pct * 100.0);
          client.write((uint8_t)0x00); client.write((uint8_t)0x03);
          client.write((uint8_t)0x00); client.write((uint8_t)0x00);
          client.write((uint8_t)0x00); client.write((uint8_t)0x11);
          client.write((uint8_t)0x01); client.write((uint8_t)0x10);
          client.write((uint8_t)0x9D); client.write((uint8_t)0x28);
          client.write((uint8_t)0x00); client.write((uint8_t)0x05);
          client.write((uint8_t)0x0A);
          client.write((uint8_t)(pct_scaled >> 8));
          client.write((uint8_t)(pct_scaled & 0xFF));
          client.write((uint8_t)0x00); client.write((uint8_t)0x00);
          client.write((uint8_t)0x00); client.write((uint8_t)0x00);
          client.write((uint8_t)0x00); client.write((uint8_t)0x00);
          client.write((uint8_t)0x00); client.write((uint8_t)0x01);

          t = millis();
          while (client.available() < 12 && millis() - t < 500) delay(5);
          client.stop();
