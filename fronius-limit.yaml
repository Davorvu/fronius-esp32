esphome:
  name: fronius-limit
  friendly_name: Fronius Export Limiter
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(params_status).publish_state("Spremno");
          id(cropex_status).publish_state("Čeka inicijalni dohvat...");

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: ERROR

ota:
  platform: esphome

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: group_mode
      name: "0. Upravljanje i režim rada"
      sorting_weight: 5
    - id: group_live
      name: "1. Live mjerenja"
      sorting_weight: 10
    - id: group_balance
      name: "2. Mjesečna bilanca (HEP)"
      sorting_weight: 20
    - id: group_params
      name: "3. Parametri i postavke"
      sorting_weight: 30

wifi:
  id: my_wifi
  ap:
    ssid: "Fronius-Limit-Setup"
    password: "12345678"
  on_connect:
    - delay: 20s
    - script.execute: fetch_cropex_prices

captive_portal:
improv_serial:

http_request:
  verify_ssl: false
  timeout: 15s

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Zagreb
    on_time:
      - seconds: 0
        minutes: 0
        hours: 15
        then:
          - script.execute: fetch_cropex_prices
      - seconds: 0
        minutes: 0
        hours: 23
        then:
          - lambda: |-
              bool has_tom = false;
              for (int i = 0; i < 24; i++) {
                if (id(cropex_tomorrow)[i] > -900.0) has_tom = true;
              }
              if (!has_tom) {
                id(fetch_cropex_prices).execute();
              }
      - seconds: 0
        minutes: 30
        hours: 5
        then:
          - lambda: |-
              bool has_tod = false;
              for (int i = 0; i < 24; i++) {
                if (id(cropex_today)[i] > -900.0) has_tod = true;
              }
              if (!has_tod) {
                id(fetch_cropex_prices).execute();
              }
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              auto now = id(sntp_time).now();
              bool has_tom = false;
              for (int i = 0; i < 24; i++) {
                if (id(cropex_tomorrow)[i] > -900.0) has_tom = true;
              }
              if (has_tom) {
                for (int i = 0; i < 24; i++) {
                  id(cropex_today)[i] = id(cropex_tomorrow)[i];
                  id(cropex_tomorrow)[i] = -9999.0;
                }
                char st_buf[96];
                if (now.is_valid()) {
                  snprintf(st_buf, sizeof(st_buf), "Danas (%02d.%02d.): Učitano 24h | Sutra: Čeka objavu (15h)", now.day_of_month, now.month);
                } else {
                  snprintf(st_buf, sizeof(st_buf), "Danas: Učitano 24h | Sutra: Čeka objavu (15h)");
                }
                id(cropex_status).publish_state(st_buf);
              }
          - delay: 300s
          - lambda: |-
              auto now = id(sntp_time).now();
              int h = now.is_valid() ? now.hour : 0;
              if (h >= 0 && h < 24 && id(cropex_today)[h] <= -900.0) {
                id(fetch_cropex_prices).execute();
              }

output:
  - platform: gpio
    pin: GPIO2
    id: blue_led

globals:
  - id: comm_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: led_blink_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: saved_month
    type: int
    restore_value: yes
    initial_value: '0'
  - id: base_import_kwh
    type: float
    restore_value: yes
    initial_value: '-1.0'
  - id: base_export_kwh
    type: float
    restore_value: yes
    initial_value: '-1.0'
  - id: last_total_import_kwh
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: last_total_export_kwh
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: active_max_w
    type: float
    restore_value: yes
    initial_value: '3680.0'
  - id: active_export_w
    type: float
    restore_value: yes
    initial_value: '3680.0'
  - id: active_margin_w
    type: float
    restore_value: yes
    initial_value: '50.0'
  - id: active_credit_kwh
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: active_min_price
    type: float
    restore_value: yes
    initial_value: '20.0'
  - id: cropex_today
    type: float[24]
    restore_value: yes
  - id: cropex_tomorrow
    type: float[24]
    restore_value: yes
  - id: http_srv_fd
    type: int
    restore_value: no
    initial_value: '-1'
  - id: cropex_url
    type: std::string
    restore_value: no
    initial_value: '"https://api.energy-charts.info/price?bzn=HR"'

text_sensor:
  - platform: template
    name: "Tokovi energije"
    id: energy_flow_visual
    update_interval: never
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 1
  - platform: template
    name: "Grafički prikaz"
    id: graf_url_info
    update_interval: never
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 2
  - platform: template
    name: "Status sustava"
    id: modbus_status
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 3
  - platform: template
    name: "Status CROPEX tablice"
    id: cropex_status
    update_interval: never
    web_server:
      sorting_group_id: group_params
      sorting_weight: 8
  - platform: wifi_info
    ip_address:
      name: "IP adresa pločice"
      id: ip_addr_sensor
      web_server:
        sorting_group_id: group_params
        sorting_weight: 9
    mac_address:
      name: "MAC adresa pločice"
      web_server:
        sorting_group_id: group_params
        sorting_weight: 10
  - platform: template
    name: "Status postavki"
    id: params_status
    update_interval: never
    web_server:
      sorting_group_id: group_params
      sorting_weight: 11
  - platform: version
    name: "Verzija softvera (SW)"
    hide_timestamp: false
    web_server:
      sorting_group_id: group_params
      sorting_weight: 12

switch:
  - platform: template
    name: "A. Ručni limit izvoza"
    id: manual_limit_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 4
    on_turn_on:
      - switch.turn_off: auto_balance_switch
      - switch.turn_off: cropex_limit_switch
  - platform: template
    name: "B. Auto balansiranje mjesec (HEP)"
    id: auto_balance_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 5
    on_turn_on:
      - switch.turn_off: manual_limit_switch
      - switch.turn_off: cropex_limit_switch
  - platform: template
    name: "C. CROPEX dinamički limit (Cijena)"
    id: cropex_limit_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: group_mode
      sorting_weight: 6
    on_turn_on:
      - switch.turn_off: manual_limit_switch
      - switch.turn_off: auto_balance_switch

sensor:
  - platform: template
    name: "Proizvodnja panela (W)"
    id: pv_power_w
    unit_of_measurement: "W"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: group_live
      sorting_weight: 1
  - platform: template
    name: "Brojilo mreža (+uvoz / -izvoz) (W)"
    id: grid_power_w
    unit_of_measurement: "W"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: group_live
      sorting_weight: 2
  - platform: template
    name: "Potrošnja kuće (W)"
    id: house_load_w
    unit_of_measurement: "W"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: group_live
      sorting_weight: 3
  - platform: template
    name: "Zadani limit invertera (%)"
    id: applied_limit_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_live
      sorting_weight: 4
  - platform: template
    name: "Trenutna CROPEX cijena (€/MWh)"
    id: current_cropex_price
    unit_of_measurement: "€/MWh"
    accuracy_decimals: 2
    web_server:
      sorting_group_id: group_live
      sorting_weight: 5
  - platform: template
    name: "Mjesečno preuzeto (kWh)"
    id: month_import_kwh
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_balance
      sorting_weight: 1
  - platform: template
    name: "Mjesečno predano (kWh)"
    id: month_export_kwh
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_balance
      sorting_weight: 2
  - platform: template
    name: "Mjesečna bilanca (+preuzeto / -predano) (kWh)"
    id: month_balance_kwh
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_balance
      sorting_weight: 3

button:
  - platform: template
    name: "7. Spremi i primijeni postavke"
    web_server:
      sorting_group_id: group_params
      sorting_weight: 7
    on_press:
      - lambda: |-
          id(active_max_w) = id(inverter_max_w).state;
          id(active_export_w) = id(max_export_w).state;
          id(active_margin_w) = id(safety_margin_w).state;
          id(active_credit_kwh) = id(initial_credit_kwh).state;
          id(active_min_price) = id(min_export_price).state;
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            char buf[40];
            snprintf(buf, sizeof(buf), "Spremljeno (%02d:%02d:%02d)", now.hour, now.minute, now.second);
            id(params_status).publish_state(buf);
          } else {
            id(params_status).publish_state("Spremljeno i aktivno");
          }
  - platform: template
    name: "Osvježi CROPEX cijene sada"
    web_server:
      sorting_group_id: group_params
      sorting_weight: 13
    on_press:
      - script.execute: fetch_cropex_prices
  - platform: template
    name: "Resetiraj mjesečni brojač na 0"
    web_server:
      sorting_group_id: group_balance
      sorting_weight: 4
    on_press:
      - lambda: |-
          id(reset_requested) = true;

text:
  - platform: template
    name: "1. IP adresa invertera"
    id: inverter_ip
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "0.0.0.0"
    web_server:
      sorting_group_id: group_params
      sorting_weight: 1

number:
  - platform: template
    name: "2. Nazivna snaga invertera (W)"
    id: inverter_max_w
    min_value: 1000
    max_value: 50000
    step: 10
    unit_of_measurement: "W"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3680
    web_server:
      sorting_group_id: group_params
      sorting_weight: 2
  - platform: template
    name: "3. Dozvoljeni izvoz u mrežu (W)"
    id: max_export_w
    min_value: 0
    max_value: 50000
    step: 10
    unit_of_measurement: "W"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3680
    web_server:
      sorting_group_id: group_params
      sorting_weight: 3
  - platform: template
    name: "4. Sigurnosna rezerva (W)"
    id: safety_margin_w
    min_value: 0
    max_value: 1000
    step: 10
    unit_of_measurement: "W"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 50
    web_server:
      sorting_group_id: group_params
      sorting_weight: 4
  - platform: template
    name: "5. Početni saldo mjeseca (kWh)"
    id: initial_credit_kwh
    min_value: -5000
    max_value: 5000
    step: 1
    unit_of_measurement: "kWh"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    web_server:
      sorting_group_id: group_params
      sorting_weight: 5
  - platform: template
    name: "6. Minimalna cijena za izvoz (€/MWh)"
    id: min_export_price
    min_value: -200
    max_value: 500
    step: 1
    unit_of_measurement: "€/MWh"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 20
    web_server:
      sorting_group_id: group_params
      sorting_weight: 6

script:
  - id: fetch_cropex_prices
    mode: single
    then:
      - lambda: |-
          id(cropex_status).publish_state("Preuzimam CROPEX (HR)...");
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            time_t t_tom = now.timestamp + 86400;
            auto tom = esphome::ESPTime::from_epoch_local(t_tom);
            char url_buf[128];
            snprintf(url_buf, sizeof(url_buf),
                     "https://api.energy-charts.info/price?bzn=HR&start=%04d-%02d-%02d&end=%04d-%02d-%02d",
                     now.year, now.month, now.day_of_month,
                     tom.year, tom.month, tom.day_of_month);
            id(cropex_url) = std::string(url_buf);
          } else {
            id(cropex_url) = "https://api.energy-charts.info/price?bzn=HR";
          }
      - http_request.get:
          url: !lambda 'return id(cropex_url);'
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    int p_idx = body.find("\"price\"");
                    if (p_idx != std::string::npos) {
                      int bracket = body.find("[", p_idx);
                      int start = bracket + 1;
                      int end = body.find("]", start);
                      std::string arr = body.substr(start, end - start);
                      float vals[200];
                      int n = 0;
                      size_t pos = 0;
                      while (pos < arr.length() && n < 200) {
                        size_t comma = arr.find(',', pos);
                        std::string tok = (comma == std::string::npos) ? arr.substr(pos) : arr.substr(pos, comma - pos);
                        if (tok != "null" && !tok.empty()) {
                          vals[n++] = atof(tok.c_str());
                        }
                        if (comma == std::string::npos) break;
                        pos = comma + 1;
                      }
                      if (n >= 24) {
                        int step = (n >= 96) ? 4 : 1;
                        int hours_avail = n / step;
                        int today_count = (hours_avail >= 24) ? 24 : hours_avail;
                        for (int h = 0; h < today_count; h++) {
                          if (step == 4) {
                            id(cropex_today)[h] = (vals[h*4] + vals[h*4+1] + vals[h*4+2] + vals[h*4+3]) / 4.0f;
                          } else {
                            id(cropex_today)[h] = vals[h];
                          }
                        }
                        auto now = id(sntp_time).now();
                        char st_buf[110];
                        if (hours_avail >= 48) {
                          for (int h = 0; h < 24; h++) {
                            if (step == 4) {
                              int idx = (24 + h) * 4;
                              id(cropex_tomorrow)[h] = (vals[idx] + vals[idx+1] + vals[idx+2] + vals[idx+3]) / 4.0f;
                            } else {
                              id(cropex_tomorrow)[h] = vals[24 + h];
                            }
                          }
                          if (now.is_valid()) {
                            auto tom = esphome::ESPTime::from_epoch_local(now.timestamp + 86400);
                            snprintf(st_buf, sizeof(st_buf), "Danas (%02d.%02d.): Učitano 24h | Sutra (%02d.%02d.): Učitano 24h",
                                     now.day_of_month, now.month, tom.day_of_month, tom.month);
                          } else {
                            snprintf(st_buf, sizeof(st_buf), "Danas: Učitano 24h | Sutra: Učitano 24h");
                          }
                          id(cropex_status).publish_state(st_buf);
                        } else {
                          for (int h = 0; h < 24; h++) {
                            id(cropex_tomorrow)[h] = -9999.0;
                          }
                          if (now.is_valid()) {
                            snprintf(st_buf, sizeof(st_buf), "Danas (%02d.%02d.): Učitano 24h | Sutra: Čeka objavu (15h)",
                                     now.day_of_month, now.month);
                          } else {
                            snprintf(st_buf, sizeof(st_buf), "Danas: Učitano 24h | Sutra: Čeka objavu (15h)");
                          }
                          id(cropex_status).publish_state(st_buf);
                        }
                      } else {
                        id(cropex_status).publish_state("Greška: Nepotpun odgovor burze");
                      }
                    } else {
                      id(cropex_status).publish_state("Greška: Nema polja cijena");
                    }
                  } else {
                    char err[48];
                    snprintf(err, sizeof(err), "HTTP greška: %d", response->status_code);
                    id(cropex_status).publish_state(err);
                  }
          on_error:
            then:
              - lambda: |-
                  id(cropex_status).publish_state("Greška spajanja na CROPEX");

interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(my_wifi).is_connected()) return;
          if (id(http_srv_fd) < 0) {
            int s = ::lwip_socket(AF_INET, SOCK_STREAM, IPPROTO_IP);
            if (s >= 0) {
              int opt = 1;
              ::lwip_setsockopt(s, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof(opt));
              int fl = ::lwip_fcntl(s, F_GETFL, 0);
              ::lwip_fcntl(s, F_SETFL, fl | O_NONBLOCK);
              struct sockaddr_in addr;
              memset(&addr, 0, sizeof(addr));
              addr.sin_family = AF_INET;
              addr.sin_port = htons(8080);
              addr.sin_addr.s_addr = htonl(INADDR_ANY);
              if (::lwip_bind(s, (struct sockaddr*)&addr, sizeof(addr)) == 0 && ::lwip_listen(s, 3) == 0) {
                id(http_srv_fd) = s;
              } else {
                ::lwip_close(s);
              }
            }
          }
          if (id(http_srv_fd) >= 0) {
            struct sockaddr_in caddr;
            socklen_t clen = sizeof(caddr);
            int cl = ::lwip_accept(id(http_srv_fd), (struct sockaddr*)&caddr, &clen);
            if (cl >= 0) {
              struct timeval tv;
              tv.tv_sec = 0;
              tv.tv_usec = 300000;
              ::lwip_setsockopt(cl, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
              char req[256];
              int r = ::lwip_recv(cl, req, sizeof(req) - 1, 0);
              if (r > 0) {
                req[r] = 0;
                if (strstr(req, "GET /data") != nullptr) {
                  float pv_v = std::isnan(id(pv_power_w).state) ? 0.0f : id(pv_power_w).state;
                  float ho_v = std::isnan(id(house_load_w).state) ? 0.0f : id(house_load_w).state;
                  float gr_v = std::isnan(id(grid_power_w).state) ? 0.0f : id(grid_power_w).state;
                  float li_v = std::isnan(id(applied_limit_pct).state) ? 100.0f : id(applied_limit_pct).state;
                  float ba_v = std::isnan(id(month_balance_kwh).state) ? 0.0f : id(month_balance_kwh).state;
                  float cr_v = std::isnan(id(current_cropex_price).state) ? -999.0f : id(current_cropex_price).state;
                  char json[256];
                  snprintf(json, sizeof(json),
                    "{\"pv\":%.1f,\"house\":%.1f,\"grid\":%.1f,\"lim\":%.1f,\"bal\":%.1f,\"crp\":%.2f,\"st\":\"%s\"}",
                    pv_v, ho_v, gr_v, li_v, ba_v, cr_v, id(modbus_status).state.c_str());
                  char resp[512];
                  int len = snprintf(resp, sizeof(resp), "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nConnection: close\r\n\r\n%s", json);
                  int sent = 0;
                  while (sent < len) {
                    int w = ::lwip_send(cl, resp + sent, len - sent, 0);
                    if (w <= 0) break;
                    sent += w;
                  }
                } else {
                  static const char page[] = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=UTF-8\r\nConnection: close\r\n\r\n"
"<!DOCTYPE html><html lang='hr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>"
"<title>Solarni nadzor</title><style>"
"body{margin:0;background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}"
"h2{margin:4px 0 2px;font-size:1.25rem;color:#38bdf8}.sub{font-size:.85rem;color:#94a3b8;margin-bottom:14px}"
".card{background:#1e293b;border-radius:16px;padding:14px;width:100%;max-width:440px;box-shadow:0 8px 24px rgba(0,0,0,.4);margin-bottom:14px}"
".grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}"
".box{background:#0f172a;padding:10px 6px;border-radius:12px}.lbl{font-size:.7rem;color:#94a3b8;text-transform:uppercase}.val{font-size:1.05rem;font-weight:700;margin-top:4px}"
".btn{display:block;width:100%;max-width:440px;text-align:center;background:#0284c7;color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:700;font-size:1rem;box-sizing:border-box}"
".dot{animation:flow 1.4s linear infinite}@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}"
"</style></head><body>"
"<h2>Solarni sustav – tokovi energije</h2><div class='sub' id='st'>Učitavanje...</div>"
"<div class='card'><svg viewBox='0 0 360 270' width='100%'>"
"<line id='l_pv_h' x1='180' y1='68' x2='80' y2='195' stroke='#334155' stroke-width='4' stroke-linecap='round'/>"
"<line id='l_pv_g' x1='180' y1='68' x2='280' y2='195' stroke='#334155' stroke-width='4' stroke-linecap='round'/>"
"<line id='l_g_h' x1='280' y1='195' x2='80' y2='195' stroke='#334155' stroke-width='4' stroke-linecap='round'/>"
